<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Funeral Invitation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="mobile-viewport">
    <!-- 1. Background Scene / Reaper Layer -->
    <div class="reaper-container" id="reaper-container">
      <img src="Images/Reaper.png" alt="Reaper" class="layer-reaper" id="img-reaper">
    </div>

    <!-- 2. Door Frame -->
    <img src="Images/frame.png" alt="Door Frame" class="layer-frame" id="img-frame">

    <!-- 3. Interactive Door -->
    <div class="door-container" id="door-container">
      <img src="Images/doot.png" alt="Door Panel" class="layer-door" id="img-door">
      <img src="Images/peephole.png" alt="Peephole" class="layer-peephole" id="img-peephole">
      <img src="Images/doorHandle.png" alt="Handle" class="layer-handle" id="img-handle">
      <img src="Images/lock.png" alt="lock" class="layer-lock" id="img-lock">
    </div>

    <!-- 3.5 Draggable Key -->
    <img src="Images/key.png" alt="Key" class="layer-key" id="img-key">

    <!-- 4. Black Fade Transition Layer -->
    <div class="fade-overlay" id="fade-overlay"></div>

    <!-- 5. Peephole View Modal -->
    <div class="peephole-modal" id="peephole-modal">
      <div class="peephole-frame">
        <img src="Images/peepholeOutside.jpg" alt="Outside view through peephole" class="peephole-image">
        <div class="vignette-overlay"></div>
      </div>
      <div class="peephole-hint">Click to step back</div>
    </div>

    <!-- 6. NEWSPAPER MODAL -->
    <div class="newspaper-modal" id="newspaper-modal">
      <div class="newspaper-content">
        <img src="Images/newspaper.png" alt="The Daily Dirge Newspaper" class="newspaper-img">
        <button class="btn-proceed" id="btn-proceed">Turpināt</button>
      </div>
    </div>

    <!-- 7. START SCREEN (Unlocks Audio Autoplay) -->
    <div class="start-screen" id="start-screen">
      <div class="start-prompt">
        <p class="start-title">Kāds ir pie durvīm</p>
        <p class="start-subtitle">Tap anywhere</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
